configuration:
  meters:
    name: Meters
    description: >-
      Meters to download. username = portal e-mail, password = portal password,
      elm = meter number (without "ELM "), data_interval = range in the form
      "27.10.2023 00:00 - 27.10.2024 00:00", id = optional entity suffix (e.g. "cottage" → sensor.pnd_consumption_cottage).
